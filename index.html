.ink-layer textarea.ink-note-editor,.ink-board textarea.ink-note-editor{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;padding:12px 14px;border:0;border-radius:3px;background:transparent;box-shadow:none;outline:none;resize:none;overflow:hidden;font-family:var(--ib-font);font-weight:600;line-height:1.22;color:inherit;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;transition:none;pointer-events:auto;touch-action:auto;-webkit-user-select:text;user-select:text}

.ink-imgitem.cropped{overflow:hidden;filter:drop-shadow(0 5px 9px rgba(18,19,58,.26))}
.ink-imgitem.cropped img{filter:none}
.ink-imgitem.cropped.loading,.ink-imgitem.cropped.missing{filter:none}
/* cropping a picture */
.ink-crop{position:absolute;left:0;top:0;z-index:3;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none}

.ink-crop-clip{position:absolute;inset:0;overflow:hidden}

.ink-crop .ink-ch::after{content:"";position:absolute;inset:-60%}
.ink-ch-nw,.ink-ch-n,.ink-ch-ne{top:0}.ink-ch-sw,.ink-ch-s,.ink-ch-se{top:100%}.ink-ch-w,.ink-ch-e{top:50%}
.ink-ch-nw,.ink-ch-w,.ink-ch-sw{left:0}.ink-ch-ne,.ink-ch-e,.ink-ch-se{left:100%}.ink-ch-n,.ink-ch-s{left:50%}
.ink-ch-nw,.ink-ch-se{cursor:nwse-resize}.ink-ch-ne,.ink-ch-sw{cursor:nesw-resize}.ink-ch-n,.ink-ch-s{cursor:ns-resize}.ink-ch-w,.ink-ch-e{cursor:ew-resize}
/* video, audio and players */
.ink-mediaitem{position:absolute;left:0;top:0;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#0B0C22;border:1px solid color-mix(in srgb,var(--ib-text) 16%,transparent);box-shadow:0 20px 44px -20px rgba(18,19,58,.6),0 2px 8px rgba(18,19,58,.12);pointer-events:auto;font-family:var(--ib-font);color:var(--ib-text)}

.ink-mbody{position:relative;flex:1;min-height:0;background:#000}

@keyframes inkPulseA{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ink-accent) 18%,transparent)}}

.ink-act.pri{flex:none;background:var(--ink-accent);color:#fff}
.ink-act.pri:hover{background:var(--ink-accent);filter:brightness(1.08)}

/* cover boxes and curtain */
.ink-coveritem{position:absolute;left:0;top:0;pointer-events:none;border-radius:8px}
.ink-cover-sheet{position:absolute;inset:0;border-radius:8px;background-color:var(--ib-surface);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ib-text) 6%,transparent) 0 7px,transparent 7px 14px);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ib-text) 18%,transparent),0 8px 18px -10px rgba(18,19,58,.45);display:grid;place-items:center;overflow:hidden;cursor:pointer;pointer-events:auto;clip-path:inset(-2px -2px -2px -2px round 8px);transition:clip-path .55s cubic-bezier(.6,0,.2,1)}

/* spotlight, reading strip, pointer */

.ink-layer textarea.ink-editor:not(.ink-note-editor),.ink-board textarea.ink-editor:not(.ink-note-editor){position:absolute;z-index:2;width:auto;min-height:0;margin:0;padding:0;border:0;border-radius:3px;background:transparent;resize:none;overflow:hidden;white-space:pre;font-family:var(--ib-font);font-weight:600;line-height:1.25;outline:1.5px dashed var(--ink-accent);outline-offset:5px;box-shadow:none;transition:none;pointer-events:auto;touch-action:auto;-webkit-user-select:text;user-select:text}

/* toolbar */

.ink-bar{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:2147480085;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 4px 4px;background:var(--ib-surface);border:1px solid var(--ib-line);border-radius:12px;box-shadow:0 14px 34px -14px rgba(18,19,58,.4),0 2px 6px rgba(18,19,58,.07);max-height:calc(100vh - 24px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;font-family:var(--ib-font)}

.ink-dot{position:absolute;right:2px;bottom:2px;width:7px;height:7px;border-radius:50%;background:var(--c,#E5383B);box-shadow:0 0 0 1.5px var(--ib-surface),0 0 0 2.3px color-mix(in srgb,var(--ib-text) 25%,transparent)}
.ink-btn.lit::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--ink-accent);box-shadow:0 0 0 1.5px var(--ib-surface)}

<script>
const MODULES=[{"id":"01","slug":"explain","name":"Explain the experience","subtitle":"From “What is AR?” to a confident 60-second product demo","theme":"purple","duration":"70–85 min","badge":"PRODUCT & VOCABULARY","outcomes":["Explain an AR experience to a non-technical client","Distinguish QR launch, image tracking and world tracking","Describe benefits, features and the customer journey","Handle common questions without overpromising"],"scenario":{"kicker":"CLIENT SCENARIO 01","name":"The coffee packaging launch","text":"A boutique coffee brand wants its new packaging to feel alive. Customers scan a QR code and see a floating 3D coffee plant with a short animation. The marketing manager asks: “So what exactly does the QR code do?”","deliverable":"Your goal: explain the experience in clear business English and give a 60-second demo."},"vocab":[["augmented reality (AR)","дополненная реальность","AR adds digital content to the real world."],["WebAR","AR в браузере","WebAR can open in a mobile browser."],["QR code","QR-код","Customers scan the QR code to open the link."],["image tracking","отслеживание изображения","The animation stays attached to the product label."],["world tracking","отслеживание пространства","The object can appear on a table or the floor."],["marker","маркер для распознавания","The printed graphic acts as a marker."],["trigger","элемент запуска","The QR code is an entry trigger."],["overlay","цифровой слой поверх изображения","A 3D overlay appears on the camera view."],["3D asset","трёхмерный объект / ассет","We create a 3D asset for the campaign."],["animation loop","зацикленная анимация","The leaves move in a short animation loop."],["user journey","путь пользователя","Let me walk you through the user journey."],["call to action (CTA)","призыв к действию","The CTA encourages customers to scan."],["browser-based","работающий в браузере","It is a browser-based experience."],["camera permission","разрешение камеры","The browser may ask for camera permission."],["immersive","создающий эффект погружения","The experience feels more immersive than a video."],["interaction","взаимодействие","Users can tap the object to interact with it."],["load time","время загрузки","We want to keep the load time short."],["compatible","совместимый","We need to check compatible devices."],["prototype","прототип","We can share a prototype before production."],["deployment","публикация / развертывание","We test the experience before deployment."]],"theory":[{"title":"The technology, explained like a professional","tag":"CORE CONCEPT","body":"**QR code ≠ AR tracking.** A QR code often opens a link to the experience. Then the experience may recognise a printed image, detect a surface, or simply display content on the screen. The workflow depends on the technology and device.","examples":[["A customer scans the QR code to **launch** the WebAR experience.","Покупатель сканирует QR-код, чтобы запустить WebAR."],["The camera then **recognises the packaging** and displays the animation.","Затем камера распознаёт упаковку и показывает анимацию."],["For a markerless experience, users can **place a 3D model on a surface**.","В AR без маркера пользователь может разместить 3D-модель на поверхности."]]},{"title":"Speak in benefits, not specifications","tag":"CLIENT-FRIENDLY ENGLISH","body":"Clients rarely want a lecture about rendering. Start with the business outcome, describe what customers do, and only then explain the technology.","examples":[["Instead of: “It uses image targets and real-time rendering.”","Вместо технического жаргона…"],["Say: “Your customers can bring the packaging to life with their phone.”","Скажи о пользе для клиента."],["“The goal is to make the product more memorable and encourage interaction.”","Объясни бизнес-цель."]]},{"title":"Useful grammar: Present Simple + can + without","tag":"B1 LANGUAGE TOOL","body":"Use the **Present Simple** for the normal user journey; **can** for possibilities; **without + -ing** to remove concerns. Do not promise that an experience works on every device.","examples":[["First, the customer **scans** the code. Then the page **opens**.","Последовательность действий."],["Users **can rotate** the 3D object and explore the details.","Возможности."],["They can try it **without downloading** a dedicated app, on supported devices.","Без скачивания приложения, на совместимых устройствах."]]}],"acts":[{"type":"mcq","title":"What does the QR code usually do?","prompt":"The marketing manager asks: “Does the QR code itself track the animation?”","options":["Yes. A QR code always keeps a 3D object attached to the packaging.","Not necessarily. It usually opens the AR experience; image tracking can then anchor the content.","QR codes only work inside a dedicated mobile app."],"answer":1,"why":"A QR code commonly launches a URL. Tracking is a separate part of the experience."},{"type":"match","title":"Match the AR vocabulary","pairs":[["image tracking","An AR effect stays linked to a printed image"],["world tracking","A 3D object is placed in the environment"],["CTA","Words that tell the user what to do next"],["3D asset","A digital object used in the experience"],["prototype","An early version used to test an idea"]]},{"type":"sort","title":"Put the user journey in order","steps":["The customer sees the CTA on the package.","They scan the QR code.","The experience opens in a browser.","They allow camera access if prompted.","They point the camera at the package.","The 3D animation appears and they interact with it."]},{"type":"fill","title":"Complete a product explanation","prompt":"Use the correct business-English words. One word in each blank.","passage":"Our AR experience ___ in a mobile browser. Customers ___ the QR code, allow camera ___ if needed, and point their phone at the ___. The 3D animation then ___ on their screen.","answers":["opens","scan","access|permission","packaging|package","appears"],"hint":"opens • scan • access • packaging • appears"},{"type":"mcq","title":"Which sentence sounds clearer to a client?","prompt":"Choose the strongest client-facing explanation.","options":["We apply advanced real-time spatial computer vision algorithms.","Your customers scan the pack and watch a 3D story come to life on their phone.","We have three.js, glTF, and low-level device APIs."],"answer":1,"why":"The second version explains the action and the visible result."},{"type":"write","title":"Turn tech language into plain English","prompt":"Rewrite this sentence for a non-technical marketing director:","quote":"“Our marker-based WebAR pipeline uses a tracked target and a rigged GLB animation.”","sample":"When customers point their phone at the printed design, an animated 3D object appears on the screen.","criteria":["Describe what customers actually do","Explain what they see","Avoid unnecessary jargon"]},{"type":"mcq","title":"Answer an objection professionally","prompt":"Client: “Will everybody be able to use it?”","options":["Absolutely, it works perfectly on all phones.","It depends on the device and browser. We can define a compatibility list and test it before launch.","I do not know. That is a developer question."],"answer":1,"why":"Professional English combines a realistic limitation with a clear next step."},{"type":"dialogue","title":"Mini discovery conversation","intro":"You meet an international brand manager. Choose the most effective answer at each step.","turns":[{"client":"How does this experience start?","options":["The customer scans a QR code, which opens the AR page in their browser.","We code it with a special algorithm.","They need to buy an AR headset."],"answer":0,"feedback":"Start with the simple user action."},{"client":"What is the benefit for our campaign?","options":["It has a high polygon count.","It is a very technical product.","It can make the packaging more engaging and give customers a new way to explore your story."],"answer":2,"feedback":"Connect the creative idea to a business goal."},{"client":"Can we see something before approving the full project?","options":["No, not until the final build.","Yes. We can prepare a simple prototype to test the idea and user flow.","You need to approve everything today."],"answer":1,"feedback":"A prototype helps the client make an informed decision."}]},{"type":"mcq","title":"Correct the client assumption","prompt":"“So users have to install our own app first, right?”","options":["Yes, every AR campaign requires an app.","Not always. A WebAR experience can open in a browser on supported devices.","Actually, AR only works on laptops."],"answer":1,"why":"Explain the WebAR option without claiming universal support."},{"type":"write","title":"The 45-second demo script","prompt":"Write 5–7 sentences in a natural order: Hook → Scan → Camera → 3D interaction → Benefit → Next step.","sample":"Imagine picking up your coffee and seeing the story behind it. First, you scan the QR code on the pack. The experience opens in your mobile browser. If prompted, you allow camera access and point your phone at the packaging. A 3D coffee plant appears, and you can tap to explore it. This helps customers connect with the brand. We could build a short prototype to show you the flow.","criteria":["Explain the steps clearly","Mention the benefit for the brand","Use at least 3 professional terms","End with a next step"]},{"type":"roleplay","title":"Live roleplay · The curious marketing manager","brief":"You are the AR specialist. Your client works for a coffee brand and knows almost nothing about AR.","client":["What happens after I scan the code?","Does the product need to be in front of the camera?","Can people use it without installing an app?","How do we know if customers like it?"],"mission":"Give a 60-second explanation, then answer two follow-up questions. Use “First…”, “Once…”, “This allows…”, “We can test…”","seconds":90},{"type":"write","title":"Follow-up email after the first meeting","prompt":"Write an email of 80–110 words: thank the client, summarise the idea, explain the proposed experience, and suggest a next step.","sample":"Subject: AR concept for your coffee packaging\n\nHi Emma,\n\nThank you for the conversation today. It was great to learn more about your new coffee range.\n\nAs discussed, we could create a browser-based AR experience. Customers would scan a QR code on the pack, point their phone at the design and discover a short animated 3D story. The goal would be to increase engagement and make the packaging more memorable.\n\nI suggest starting with a simple prototype so your team can review the experience before production. Would Thursday work for a short follow-up call?\n\nBest regards,","criteria":["Polite opening and clear purpose","Accessible explanation of WebAR","Specific proposed next step"]}],"mission":"Deliver a 60-second explanation of the product and a 90-word follow-up email. You should be able to explain both what the customer sees and why the brand might want it."},{"id":"02","slug":"pitch","name":"Discover & pitch","subtitle":"Ask better questions, build a brief and sell the creative concept","theme":"blue","duration":"75–90 min","badge":"MEETINGS & SALES","outcomes":["Run a structured discovery call","Ask about audience, KPIs, assets and constraints","Pitch a creative AR concept with a clear rationale","Make recommendations and explain trade-offs"],"scenario":{"kicker":"CLIENT SCENARIO 02","name":"The skincare product reveal","text":"A skincare company is launching a serum. Their first idea is “something cool with 3D”. The campaign goes live in six weeks, but no one has agreed on the goal, target audience or deliverables.","deliverable":"Your goal: turn a vague request into a clear creative brief and a convincing pitch."},"vocab":[["creative brief","креативное ТЗ","The creative brief defines what we need to deliver."],["stakeholder","заинтересованная сторона","Who will be the main stakeholder?"],["target audience","целевая аудитория","Who is the target audience?"],["business objective","бизнес-цель","What is the main business objective?"],["deliverable","результат работы / материал к сдаче","What are the final deliverables?"],["scope","объём работ","We need to define the scope."],["in scope","входит в объём работ","Three 3D products are in scope."],["out of scope","не входит в объём работ","A mobile app is out of scope."],["moodboard","мудборд","The moodboard captures the visual direction."],["style frame","ключевой статичный кадр в финальном стиле","We will present two style frames."],["storyboard","раскадровка","The storyboard shows each scene."],["animatic","черновая анимированная раскадровка","The animatic helps us test timing."],["brand guidelines","брендбук / правила фирменного стиля","Could you share the brand guidelines?"],["touchpoint","точка контакта с аудиторией","Packaging is the first touchpoint."],["campaign activation","активация маркетинговой кампании","The AR element is part of the campaign activation."],["conversion","конверсия","We should define what counts as a conversion."],["engagement","вовлечённость","The objective may be to improve engagement."],["budget range","диапазон бюджета","Do you have a budget range in mind?"],["deadline","крайний срок","What is the launch deadline?"],["sign-off","финальное утверждение","Who is responsible for final sign-off?"]],"theory":[{"title":"A discovery call is not a product demo","tag":"DISCOVERY FRAMEWORK","body":"Ask questions in this order: **Goal → Audience → Context → Experience → Constraints → Decision**. The strongest specialists diagnose before recommending a solution.","examples":[["What would success look like for this campaign?","Как будет выглядеть успех кампании?"],["Who are we trying to reach?","Кого мы хотим охватить?"],["Where will people discover the QR code?","Где люди увидят QR-код?"],["Who needs to approve the final concept?","Кто будет утверждать концепцию?"]]},{"title":"Polite questions that sound confident","tag":"FUNCTIONAL GRAMMAR","body":"Use **Could you tell me…? / I was wondering if… / Do you have … in mind?** to ask professionally. In indirect questions, use statement word order: “Could you tell me **when the campaign launches**?”","examples":[["Could you tell me what the main priority is?","Не “what is the main priority?” после вводной фразы."],["Do you have a specific visual style in mind?","Есть ли у вас конкретный визуальный стиль?"],["I was wondering if you already have 3D assets.","Хотела уточнить, есть ли у вас готовые 3D-ассеты."]]},{"title":"Pitch the concept, not just the effect","tag":"PRESENTATION STRUCTURE","body":"Try **Insight → Idea → User journey → Value → Feasibility → Next step**. Name the concept and connect each creative decision to the user experience.","examples":[["Our concept is called “Inside the Formula”.","Название концепции."],["The idea is to reveal what makes the product unique.","Суть идеи."],["This gives users a reason to explore rather than simply watch.","Почему это ценно."],["We recommend starting with one hero product to keep the scope focused.","Практичная рекомендация."]]},{"title":"How to recommend, compare and set boundaries","tag":"B1 → B1+","body":"“I’d recommend…” is more natural than “You must…”. For compromises, use **The advantage is… / The trade-off is… / Given the timeline…**.","examples":[["I’d recommend image tracking because the packaging is central to the experience.","Я бы рекомендовала image tracking, потому что…"],["The main advantage is a clear connection to the product.","Главное преимущество…"],["Given the six-week timeline, a simpler interaction may be more realistic.","Учитывая шестинедельный срок…"]]}],"acts":[{"type":"mcq","title":"Find the missing objective","prompt":"Client: “We just want something impressive with 3D.” What should you ask first?","options":["Can you pay the deposit today?","What would you like people to do or feel after using the experience?","Would you like fifty animations?"],"answer":1,"why":"A business objective should guide the creative direction."},{"type":"match","title":"Discovery call vocabulary","pairs":[["target audience","Who the campaign is for"],["deliverable","The final thing the studio provides"],["stakeholder","A person involved in the decision"],["sign-off","Formal approval to move forward"],["budget range","The approximate amount available"]]},{"type":"fill","title":"Make these questions more polite","prompt":"Complete the phrases using suitable words.","passage":"___ you tell me who the audience is? Do you have a budget range ___ mind? I was ___ if you already have 3D assets. Who will be responsible ___ final sign-off?","answers":["Could","in","wondering","for"],"hint":"Could / in / wondering / for"},{"type":"sort","title":"Order a productive discovery call","steps":["Clarify the client’s main objective.","Learn about the target audience.","Ask where and how users will discover the experience.","Discuss assets, platform and technical requirements.","Confirm budget, timeline and approval process.","Summarise the brief and agree on next steps."]},{"type":"mcq","title":"Which KPI fits the goal?","prompt":"The client wants more visitors to tap “Shop now” after exploring the serum.","options":["Only the number of 3D polygons","The number of CTA clicks or an agreed conversion metric","Only the length of the animation"],"answer":1,"why":"Choose a metric that reflects the agreed business action."},{"type":"write","title":"Write seven discovery questions","prompt":"Imagine you have 8 minutes to understand the skincare brand. Write at least one question about each topic: goal, audience, entry point, visual direction, assets, budget, approval.","sample":"What is the main goal of the campaign? Who is your target audience? Where will customers see the QR code? Do you have a visual direction in mind? Could you share any existing 3D assets? What budget range are you working with? Who will be responsible for final approval?","criteria":["Ask specific open questions","Use at least two indirect questions","Cover both creative and business constraints"]},{"type":"dialogue","title":"Discovery call simulator","intro":"A client has a good idea but an unclear brief. Keep the meeting moving.","turns":[{"client":"We want something viral. Can you just make a cool effect?","options":["Of course, we can guarantee virality.","Happy to explore ideas. Could you tell me what you want the experience to achieve?","That is a bad brief."],"answer":1,"feedback":"Do not promise an outcome you cannot control."},{"client":"We want to drive people to our website.","options":["Great. Shall we make the website visit the main call to action and track clicks?","So we should create a huge animation without a button.","There is no way to measure this."],"answer":0,"feedback":"Connect a clear action to measurable outcomes."},{"client":"Can we add ten more product variations next week?","options":["Yes, all changes are always free.","No. Absolutely not.","We can review the additional scope and see how it affects the timeline and budget."],"answer":2,"feedback":"Stay flexible without accepting unscoped work."}]},{"type":"mcq","title":"Present a smart recommendation","prompt":"You need a simple launch in six weeks. How do you phrase the recommendation?","options":["You must cancel your complicated idea because it is impossible.","Given the timeline, I would recommend launching with one hero product and expanding later.","Your idea is too hard and we have no time."],"answer":1,"why":"This recommendation offers a manageable alternative."},{"type":"write","title":"Develop a 90-second creative pitch","prompt":"Pitch “Inside the Formula”: the serum packaging unlocks an interactive visual story about three ingredients. Mention goal, audience, customer journey, CTA and next step.","sample":"We call the concept “Inside the Formula”. The goal is to help younger customers understand the product and encourage them to explore the full range. After scanning the QR code, users see three animated ingredients appear around the serum bottle. They can tap each ingredient to learn about its purpose and then choose “Discover the range”. This approach turns product information into a short, engaging experience. Given the deadline, I would recommend a focused prototype with one bottle first. If you like the direction, we can confirm the production scope.","criteria":["Clear concept and target audience","At least one business benefit","Concrete recommendation and next step"]},{"type":"roleplay","title":"Live roleplay · The difficult brief","brief":"The client wants “something wow” but cannot say what success means. You are leading the discovery call.","client":["We need something that feels premium.","We do not have a big budget.","We may want to add a game later.","Our CEO wants to approve everything personally."],"mission":"Ask at least five questions; summarise the brief in two sentences; recommend a realistic direction.","seconds":150},{"type":"write","title":"Create a one-page client brief","prompt":"Write a 120–160-word mini brief with: Objective, Audience, Experience, Entry point, Deliverables, KPI, Timeline, Risks, Approval.","sample":"Project: Inside the Formula\nObjective: Help potential customers understand the new serum and encourage visits to the product page.\nAudience: Mobile-first skincare shoppers aged 20–35.\nExperience: Users scan a QR code on packaging, open the WebAR experience and explore three animated ingredients.\nEntry point: Product packaging and campaign displays.\nDeliverables: One WebAR experience, one 3D bottle, three animated ingredients, a CTA and basic analytics.\nKPI: Experience launches and taps on the product CTA (definitions to be agreed).\nTimeline: Six weeks, subject to asset delivery and approvals.\nRisks: Device compatibility, tracking quality and delayed feedback.\nApprovals: Brand manager and final sign-off from the CEO.","criteria":["Specific scope and deliverables","Measurable goal","Clear constraints and approval owner"]},{"type":"mcq","title":"Indirect question check","prompt":"Which version is grammatically correct?","options":["Could you tell me when does the campaign launch?","Could you tell me when the campaign launches?","Could you tell when launches the campaign?"],"answer":1,"why":"Indirect questions use statement word order after the introductory phrase."},{"type":"write","title":"Meeting recap email","prompt":"Write a professional meeting recap. Confirm the goal, scope, open questions and next steps. Target: 90–120 words.","sample":"Subject: Follow-up and next steps — Inside the Formula\n\nHi Alex,\n\nThanks for the productive call. To recap, the main goal is to make the new serum launch more engaging and encourage visitors to explore the product range.\n\nWe discussed a WebAR concept with one 3D bottle, three interactive ingredients and a clear call to action. Before we finalise the proposal, could you share the brand guidelines, available 3D assets and your target launch date?\n\nI will prepare a concept outline with the proposed scope and estimated timeline. Shall we review it together next Tuesday?\n\nBest regards,","criteria":["Concise recap","Useful information requests","Specific next action"]}],"mission":"Run a discovery call, produce a coherent creative brief and pitch a concept in 90 seconds."},{"id":"03","slug":"produce","name":"Manage the production","subtitle":"Talk to designers, explain decisions and handle revisions diplomatically","theme":"coral","duration":"75–90 min","badge":"PROJECTS & FEEDBACK","outcomes":["Explain the animation and AR production pipeline","Communicate technical limitations in plain English","Give constructive feedback and manage revision rounds","Negotiate timelines, scope changes and priorities"],"scenario":{"kicker":"CLIENT SCENARIO 03","name":"The animated sneaker drop","text":"A footwear brand approved a WebAR sneaker concept. Production is halfway through. The client now wants five more colours, a longer animation and a new interaction—but insists the launch date cannot change.","deliverable":"Your goal: protect the project while keeping the relationship positive."},"vocab":[["production pipeline","этапы производства","Let me explain the production pipeline."],["asset preparation","подготовка ассетов","We are finishing asset preparation."],["modelling","3D-моделирование","The team has completed the modelling."],["texturing","текстурирование","Texturing adds surface detail."],["rigging","создание системы управления анимацией","The character needs rigging."],["keyframe","ключевой кадр","We adjusted the keyframes."],["easing","плавность / характер ускорения","We should improve the easing."],["rendering","рендеринг","The rendering stage takes time."],["compositing","композитинг / совмещение слоёв","Compositing brings the elements together."],["GLB / glTF","формат трёхмерного актива","We can export the model as a GLB."],["USDZ","3D-формат экосистемы Apple","USDZ is used for some Apple AR workflows."],["texture","текстура","Large textures can affect loading."],["polygon count","количество полигонов","We should keep the polygon count under control."],["optimisation","оптимизация","The model needs optimisation for mobile."],["frame rate","частота кадров","We should test the frame rate."],["revision round","раунд правок","Two revision rounds are included."],["change request","запрос на изменение объёма работ","Let us log this as a change request."],["milestone","контрольный этап","The next milestone is the prototype review."],["blocker","препятствие, блокирующее работу","Approval is the main blocker."],["quality assurance (QA)","контроль качества","QA includes testing different devices."]],"theory":[{"title":"The motion + WebAR pipeline","tag":"WORKFLOW","body":"A typical project moves through **brief → storyboard → style frames → animatic → assets → animation → integration → QA → launch**. Not every project uses every stage, but approving key stages early helps reduce rework.","examples":[["We are currently finalising the style frames.","Сейчас мы завершаем ключевые стилевые кадры."],["Once the animatic is approved, we can move into full animation.","После утверждения аниматика можно переходить к полной анимации."],["The build is ready for testing on real devices.","Сборка готова для тестирования на реальных устройствах."]]},{"title":"Technical constraints, without panic","tag":"REAL-LIFE TECH TALK","body":"3D files and textures affect loading and performance. **GLB/glTF** is widely used for web 3D; **USDZ** is relevant to Apple AR workflows. Formats and device support vary by implementation. Say what needs testing, not “everything will work.”","examples":[["The model looks great, but we need to optimise it for mobile performance.","Модель выглядит отлично, но её нужно оптимизировать для мобильных устройств."],["We should test loading speed on a range of devices.","Нужно протестировать скорость загрузки на разных устройствах."],["We may need a lighter version of the asset.","Возможно, понадобится облегчённая версия ассета."]]},{"title":"Professional feedback language","tag":"POLITE DISAGREEMENT","body":"Use **What works well is… / One concern is… / Could we try…? / The reason I suggest this is…**. Describe the issue, its impact and the proposed solution rather than judging the client.","examples":[["What works well is the colour palette; the opening motion could be a little smoother.","Хорошо работает палитра; начальное движение можно сделать плавнее."],["One concern is that the longer animation may increase the time before the CTA appears.","Есть опасение, что длинная анимация задержит CTA."],["Could we try a shorter loop and compare both versions?","Можем попробовать более короткий цикл и сравнить версии?"]]},{"title":"Conditionals for deadlines and scope","tag":"B1 GRAMMAR","body":"Use the **First Conditional** for realistic consequences: “If we add X, we’ll need Y.” Use **would** for polite alternatives: “We could… / I’d suggest…”. Be specific about what is included.","examples":[["If we add five product colours, we will need additional production time.","Если добавим пять цветов, понадобится дополнительное время."],["We can keep the date if we prioritise the existing scope.","Сохраним срок, если оставим текущий объём работ."],["I’d suggest treating the game mechanic as phase two.","Предлагаю перенести игровую механику на второй этап."]]}],"acts":[{"type":"sort","title":"Rebuild the production pipeline","steps":["Approve the creative brief.","Review the storyboard and style frames.","Test the animatic and timing.","Prepare and optimise 3D assets.","Animate and integrate the WebAR build.","Run device testing and QA.","Receive final sign-off and launch."]},{"type":"match","title":"Production terms in context","pairs":[["style frame","A still image showing the final visual direction"],["animatic","A timed storyboard preview"],["GLB","A format often used to deliver web 3D assets"],["optimisation","Reducing performance costs where possible"],["change request","A formal request to adjust the agreed scope"]]},{"type":"mcq","title":"Respond to late feedback","prompt":"Client: “Can you add five new colours and a game? We still launch on Friday.”","options":["Yes, no problem. The extra work is free.","Those ideas sound interesting. Let us review the impact on the scope, timeline and budget before confirming.","This is your fault and we will not do it."],"answer":1,"why":"Acknowledge the idea and set a professional process."},{"type":"fill","title":"Use the first conditional","prompt":"Complete the consequences of project changes.","passage":"If the client ___ the scope, we ___ need to update the timeline. If we ___ the model, the experience may load faster. We can launch on time if the client ___ the final storyboard today.","answers":["changes","will","optimise|optimize","approves"],"hint":"changes / will / optimise / approves"},{"type":"mcq","title":"Choose a realistic technical statement","prompt":"A large 3D model is loading slowly on older phones.","options":["More polygons always make AR faster.","We can optimise the assets, reduce unnecessary detail and test again on representative devices.","A fast Wi-Fi connection guarantees all devices will perform equally."],"answer":1,"why":"Optimisation + real-device testing is a responsible next step."},{"type":"write","title":"Translate a designer’s update into client English","prompt":"Your 3D artist says: “The mesh is too heavy, textures are huge, and the framerate tanks on older devices.” Write a calm client update.","sample":"The visual quality is looking good, but the current 3D asset needs some optimisation for mobile. We are reducing unnecessary detail and adjusting the textures to improve loading and performance. We will test the updated version on a range of devices before the next review.","criteria":["Avoid unnecessarily technical terms","Explain the impact","State what the team is doing next"]},{"type":"dialogue","title":"Feedback meeting · Keep it constructive","intro":"The client is unhappy with the animation. Find a productive way forward.","turns":[{"client":"The transition feels a bit awkward.","options":["That is not true.","Could you show me which part feels awkward? We can review the timing and easing.","You probably do not understand animation."],"answer":1,"feedback":"Clarify feedback before making changes."},{"client":"Can you make it twice as long?","options":["Potentially, yes. The trade-off is that the main message and CTA will appear later. Could we test both timings?","Longer is always better.","No, because I said so."],"answer":0,"feedback":"Explain the user-experience trade-off."},{"client":"I thought unlimited revisions were included.","options":["You are completely wrong.","We never do revisions.","The agreed scope includes two review rounds. I can outline options for any additional changes."],"answer":2,"feedback":"Reference the agreement without sounding aggressive."}]},{"type":"mcq","title":"Grammar: a conditional consequence","prompt":"Which sentence is correct?","options":["If we will change the design, we need more time.","If we change the design, we will need more time.","If we changed the design, we will need more time yesterday."],"answer":1,"why":"First Conditional: if + Present Simple, will + base form."},{"type":"write","title":"The change-request email","prompt":"Write 100–130 words. The client requests a mini-game and five colour variations. Offer two options: protect the date or extend the scope.","sample":"Subject: Additional features — impact on scope and timing\n\nHi Sam,\n\nThanks for sharing the new ideas. The mini-game and additional colour variations could be a great extension to the experience.\n\nAs these features were not part of the approved scope, we would need to review the timeline and budget before confirming them.\n\nI see two possible options. We can keep the current launch date and deliver the originally approved experience, then add the new features in phase two. Alternatively, we can include the changes now and provide an updated estimate and delivery plan.\n\nWhich option would work better for your team? Happy to discuss this on a short call.\n\nBest regards,","criteria":["Positive acknowledgement","Scope and timeline clarity","Two actionable options","Polite question at the end"]},{"type":"roleplay","title":"Live roleplay · A tough project review","brief":"The client asks for extra work halfway through production and does not want the launch date to move.","client":["Can we have five new colourways?","And could the animation be 30 seconds longer?","I assumed that was included.","Our launch date is fixed. What can you do?"],"mission":"Clarify priorities, explain consequences with “if…”, propose at least two options and agree on a decision.","seconds":180},{"type":"write","title":"Daily production stand-up","prompt":"Prepare a 60–90-second spoken status update: Done / In progress / Blocker / Next / Risk. Write speaking notes.","sample":"Yesterday we finalised the 3D modelling and approved the base materials. Today we are optimising the assets and adjusting the opening animation. The main blocker is the client’s approval of the final colour palette. If we receive feedback by Thursday, we can stay on schedule. Our next milestone is the interactive prototype review on Monday.","criteria":["Use clear status language","Name a blocker without blame","Explain the next step and a risk"]},{"type":"mcq","title":"What is an animatic?","prompt":"Pick the correct meaning.","options":["A fully launched AR experience","A timed preview built from storyboard frames, sometimes with sound","The signed financial agreement"],"answer":1,"why":"An animatic is used to evaluate sequence and timing before final animation."},{"type":"write","title":"Write three pieces of constructive feedback","prompt":"Give three examples of useful feedback about: opening animation, 3D model, and CTA visibility.","sample":"1. The opening animation has a strong visual direction, but could we make the first transition a little smoother?\n2. The sneaker looks impressive; I would suggest simplifying some details to support mobile performance.\n3. The CTA is clear, but it appears quite late. Could we test showing it a few seconds earlier?","criteria":["Say what works well","Identify an observable issue","Suggest a feasible improvement"]}],"mission":"Manage a live feedback meeting, negotiate an out-of-scope request and write a professional project update."},{"id":"04","slug":"launch","name":"Launch & grow","subtitle":"Report on campaign results, negotiate next steps and run a full client meeting","theme":"green","duration":"80–95 min","badge":"RESULTS & NEGOTIATION","outcomes":["Discuss launch readiness and QA","Interpret basic AR campaign metrics","Present results without misleading conclusions","Negotiate future work and lead a complete client meeting"],"scenario":{"kicker":"CLIENT SCENARIO 04","name":"The retail window AR campaign","text":"An AR installation has been live for two weeks. The retailer wants a report. QR visits are strong, but many users leave before the final CTA. The client asks if the campaign was a success and whether they should invest in a second phase.","deliverable":"Your goal: interpret the data, explain a potential problem and propose a credible next phase."},"vocab":[["launch readiness","готовность к запуску","Let us review launch readiness."],["go live","запускаться в публичный доступ","The campaign goes live on Monday."],["rollout","поэтапный запуск","We recommend a phased rollout."],["user testing","тестирование пользователями","User testing identified two issues."],["tracking stability","стабильность трекинга","We need to check tracking stability."],["scan / QR visit","сканирование / переход по QR","We recorded 2,400 QR visits."],["experience start","запуск AR-сессии","Not every visit becomes an experience start."],["completion rate","доля завершивших действие","The completion rate improved."],["click-through rate (CTR)","доля переходов по клику","We should define the CTR denominator."],["engagement time","время активного взаимодействия","Engagement time helps us understand use."],["funnel","воронка","Let us look at the user funnel."],["drop-off","отток пользователей на этапе","We noticed drop-off after the loading screen."],["insight","вывод из данных","One insight is that the CTA appears too late."],["iteration","итерация / доработка","A small iteration may improve the experience."],["benchmark","ориентир для сравнения","We need a relevant benchmark."],["attribution","атрибуция результата","Sales attribution requires a careful setup."],["conversion event","целевое действие","A CTA click can be a conversion event."],["proposal","предложение по проекту","We will share a phase-two proposal."],["retainer","регулярное обслуживание за фиксированную оплату","An ongoing support retainer is one option."],["next steps","следующие шаги","Let us agree on the next steps."]],"theory":[{"title":"Read the funnel, not a vanity number","tag":"MEASUREMENT","body":"A useful funnel might be **QR visits → experience starts → completed interactions → CTA clicks**. Define each stage clearly. A “scan” can mean different things depending on analytics setup; never mix denominators.","examples":[["We recorded 2,400 QR visits and 1,800 experience starts.","Зафиксировано 2400 переходов и 1800 запусков AR."],["The experience-start rate is 75% of QR visits.","Доля запусков — 75% от QR-переходов."],["We should investigate why users leave before the CTA.","Стоит выяснить, почему пользователи уходят до CTA."]]},{"title":"Data language: factual vs speculative","tag":"REPORTING ETHICS","body":"Say **“The data shows…”** for a measured fact. Say **“This may suggest…” / “One possible explanation is…”** for an interpretation. Avoid claiming an AR experience caused sales unless tracking or research supports it.","examples":[["The data shows a drop-off between starting and completing the experience.","Данные показывают отток между запуском и завершением."],["One possible explanation is the long opening sequence.","Возможное объяснение — длинная вступительная анимация."],["We recommend testing a shorter version before drawing conclusions.","Предлагаем протестировать короткую версию прежде, чем делать выводы."]]},{"title":"Present results with a clear story","tag":"BUSINESS PRESENTATION","body":"Use **Result → Meaning → Recommendation → Next step**. Begin with the campaign objective and explain metrics only when they help the client make a decision.","examples":[["Our main objective was to encourage product discovery.","Главная цель заключалась в знакомстве с продуктом."],["We saw strong initial interest but a drop-off later in the journey.","В начале интерес был высоким, но позже наблюдался отток."],["I suggest moving the CTA earlier and running an A/B test.","Предлагаю показать CTA раньше и провести A/B-тест."]]},{"title":"Negotiate without sounding defensive","tag":"CLIENT NEGOTIATION","body":"Useful structures: **I understand your concern. / The challenge is… / What we can offer is… / Would you be open to…?** Name what you can commit to and what still needs agreement.","examples":[["I understand that the launch date is important for your retail campaign.","Понимаю, что срок запуска важен для кампании."],["What we can offer is a short optimisation sprint followed by a performance review.","Можем предложить короткий этап оптимизации и анализ результатов."],["Would you be open to testing the revised version for another two weeks?","Вы готовы протестировать обновлённую версию ещё две недели?"]]}],"acts":[{"type":"sort","title":"Launch-ready checklist: arrange the process","steps":["Confirm the approved creative and content.","Test the QR journey and camera permissions.","Check the experience on target devices and browsers.","Review loading, tracking and interactions.","Verify analytics events and the CTA link.","Get final client sign-off.","Launch and monitor the first sessions."]},{"type":"mcq","title":"What does a QR visit measure?","prompt":"Your report shows 2,400 QR visits.","options":["2,400 guaranteed completed AR sessions","2,400 visits attributed to the QR entry point, based on the tracking setup","2,400 sales caused by AR"],"answer":1,"why":"Do not equate visits, completed sessions and purchases."},{"type":"match","title":"Campaign analytics vocabulary","pairs":[["drop-off","Users stop before reaching a later step"],["engagement time","Time users actively spend with the experience"],["conversion event","A defined action that matters to the campaign"],["insight","A useful interpretation supported by evidence"],["attribution","How an outcome is linked to a marketing activity"]]},{"type":"metric","title":"Explore the client’s funnel","figures":[["QR visits",2400],["AR starts",1800],["Completed interactions",1080],["CTA clicks",324]],"prompt":"Work out each stage-to-stage rate and make one practical recommendation.","explanation":"Start rate = AR starts ÷ QR visits. Completion rate = completions ÷ AR starts. CTA click rate here = CTA clicks ÷ completions. Always state the denominator."},{"type":"fill","title":"Report with the right level of certainty","prompt":"Complete the data story.","passage":"The data ___ that 1,800 people started the experience. This may ___ that the first step is working well. One possible ___ for later drop-off is the long animation. We ___ testing a shorter version.","answers":["shows","suggest","explanation|reason","recommend"],"hint":"shows • suggest • explanation • recommend"},{"type":"mcq","title":"Avoid an unsupported claim","prompt":"The brand asks: “Did AR increase our sales?” You only tracked QR visits and CTA clicks.","options":["Yes, AR definitely increased sales by 50%.","We can report visits and CTA clicks. To measure sales impact, we would need suitable conversion tracking or additional research.","Every CTA click is a purchase."],"answer":1,"why":"State what the available data does and does not prove."},{"type":"write","title":"Give a 60-second results summary","prompt":"Use the figures from the funnel. Explain one positive signal, one problem, one test and one limitation.","sample":"Over the first two weeks, we recorded 2,400 QR visits and 1,800 AR starts, giving us a 75% start rate. That suggests a reasonable proportion of visitors are entering the experience. However, only 1,080 users completed the main interaction, which is 60% of starts. One possible issue is that the opening animation is too long. I recommend testing a shorter introduction and an earlier CTA. We can measure the results, but we cannot yet claim that the campaign increased sales.","criteria":["Use correct numbers and denominators","Separate fact from interpretation","Offer a measurable next step"]},{"type":"dialogue","title":"The results meeting","intro":"The client is worried about the late-stage drop-off. Stay credible and useful.","turns":[{"client":"Our QR numbers look high. Does that mean the campaign was a success?","options":["Yes, high scans always equal high sales.","The initial interest is encouraging, but we should also look at completed interactions and CTA clicks.","We should ignore the data."],"answer":1,"feedback":"Analyse the full funnel in relation to the goal."},{"client":"Why do people leave before finishing?","options":["The data shows drop-off, but we need more testing to understand the cause. One hypothesis is the long opening sequence.","Because customers do not care about your brand.","It is definitely a browser bug."],"answer":0,"feedback":"Use cautious language for an untested hypothesis."},{"client":"What would you recommend for the next phase?","options":["Launch a much bigger experience without testing anything.","Do nothing because the campaign is perfect.","Test a shorter introduction, move the CTA earlier and compare results against the current version."],"answer":2,"feedback":"Recommend a focused and measurable iteration."}]},{"type":"mcq","title":"The strongest negotiation line","prompt":"Client: “Can you do phase two for half the budget?”","options":["No. That is an insulting offer.","We can explore a smaller phase-two scope that fits the budget. Which features are the highest priority?","Yes, we will deliver everything for half the price without changing the scope."],"answer":1,"why":"Trade scope for budget rather than promising the same work for less."},{"type":"write","title":"Propose a phase-two experiment","prompt":"Write a mini proposal: hypothesis, change, KPI, time period, risk and decision rule. Make it concrete without inventing guaranteed results.","sample":"Hypothesis: More users will complete the experience if we shorten the introduction.\nChange: Reduce the opening from 15 seconds to 6 seconds and display the CTA earlier.\nKPI: Completion rate, defined as completed interactions divided by AR starts.\nTest period: Two weeks with comparable traffic sources.\nRisk: The shorter experience may feel less cinematic.\nDecision rule: Review performance and user feedback before choosing the version to roll out.","criteria":["Testable hypothesis","Defined KPI and denominator","Reasonable decision rule"]},{"type":"roleplay","title":"Final simulation · The full client meeting","brief":"You are the lead AR specialist presenting the retail campaign results and proposing phase two to an international client.","client":["What was the main idea behind the campaign?","How did customers access it?","What did the numbers tell you?","We are worried about the drop-off.","Our budget is limited. What do you propose?","What are the next steps?"],"mission":"Lead a 5-minute meeting: recap → numbers → interpretation → recommendation → negotiation → action items.","seconds":300},{"type":"write","title":"The final client email","prompt":"Write a polished 120–160-word email with a results summary, a limitation, an optimisation plan and a meeting request.","sample":"Subject: AR campaign results and proposed next steps\n\nHi Jordan,\n\nThank you for reviewing the first two weeks of the campaign with us.\n\nWe recorded 2,400 QR visits and 1,800 AR starts, representing a 75% start rate. We also saw that 1,080 users completed the main interaction. This gives us a useful starting point, although the current tracking does not show whether the experience affected sales.\n\nOne possible explanation for the drop-off is the length of the opening animation. I would suggest testing a shorter introduction and showing the CTA earlier. We could compare completion and click rates over a two-week period before deciding on the next rollout.\n\nWould you be available for a 20-minute call on Thursday to agree on the testing scope and budget?\n\nBest regards,","criteria":["Accurate metrics","Clear limitation","Concrete proposal","Professional close"]},{"type":"write","title":"Your complete AR account manager pitch","prompt":"Final challenge: write a 2-minute pitch for a new QR-launched WebAR activation. Cover: objective, target audience, experience, creative direction, 3D assets, delivery stages, risks, KPIs and next step.","sample":"We propose an interactive WebAR experience designed to make your packaging stand out and encourage customers to explore the product. The target audience is mobile-first shoppers who discover the campaign in-store. After scanning a QR code, users open the experience, allow camera access if prompted and see animated 3D content connected to the packaging. We would begin with a creative brief and storyboard, followed by style frames, a prototype, asset production, integration and testing. We would define compatible devices and optimise the assets for mobile performance. To measure the campaign, we would track QR visits, experience starts, completed interactions and CTA clicks, with clear definitions. The next step would be a discovery workshop to confirm the scope, timeline and budget.","criteria":["Client-friendly technology explanation","Business and creative reasoning","Production/QA awareness","Measurable success and next steps"]}],"mission":"Lead a realistic end-to-end client conversation, present a results story and close with a credible next-step proposal."}];
const PHRASES={"Opening a meeting":[["Thanks for making the time today.","Спасибо, что нашли время сегодня."],["Before we jump in, could I ask a few questions?","Прежде чем перейдём к делу, можно уточнить несколько моментов?"],["The main goal of today’s call is to…","Главная цель сегодняшнего звонка — …"],["Could you walk me through the idea?","Можете рассказать мне об идее по порядку?"],["Just to make sure I understand correctly…","Чтобы убедиться, что я правильно понимаю…"]],"Clarifying the brief":[["What would success look like for you?","Что для вас будет означать успех?"],["Who is the experience aimed at?","На кого рассчитан проект?"],["Do you have a launch date in mind?","Вы уже определились с датой запуска?"],["What is included in the current scope?","Что входит в текущий объём работ?"],["Who will give the final sign-off?","Кто будет окончательно утверждать проект?"]],"Pitching an idea":[["The idea behind this concept is…","Идея этой концепции заключается в…"],["What makes this approach interesting is…","Что делает этот подход интересным…"],["Let me walk you through the user journey.","Позвольте показать путь пользователя."],["The main benefit for your audience is…","Главная польза для вашей аудитории…"],["I would recommend starting with…","Я бы рекомендовала начать с…"]],"Feedback & boundaries":[["That is a useful point.","Это полезное замечание."],["One concern I have is…","Один момент, который меня беспокоит…"],["Could we explore another option?","Можем рассмотреть другой вариант?"],["That would be outside the agreed scope.","Это будет за рамками согласованного объёма работ."],["We can look at the impact on timing and cost.","Мы можем оценить влияние на сроки и стоимость."]],"Reporting & closing":[["The data shows that…","Данные показывают, что…"],["This may suggest that…","Это может указывать на то, что…"],["One possible explanation is…","Одно из возможных объяснений…"],["Our recommendation would be to…","Мы бы рекомендовали…"],["To summarise, our next steps are…","Подводя итог, наши следующие шаги…"]]};
const TOTAL=MODULES.reduce((n,m)=>n+m.acts.length,0);

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('visible');clearTimeout(window.__toastTimeout);window.__toastTimeout=setTimeout(()=>el.classList.remove('visible'),2500)}
function fx(kind='tap'){
 if(!soundEnabled)return;
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;window.__ac=window.__ac||new AC();const ctx=window.__ac;if(ctx.state==='suspended')ctx.resume();
 let notes={tap:[[620,0,.065],[880,.07,.065]],success:[[660,0,.09],[830,.09,.12],[1100,.21,.19]],error:[[350,0,.12],[270,.13,.15]],scan:[[400,0,.08],[550,.08,.08],[740,.16,.1],[1040,.29,.26]],sparkle:[[900,0,.12],[1200,.13,.13],[1540,.26,.18]],swipe:[[480,0,.10],[700,.10,.12]]}[kind]||[[650,0,.08]];
 notes.forEach(([frequency,delay,duration])=>{const o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime+delay;o.type=kind==='error'?'triangle':'sine';o.frequency.setValueAtTime(frequency,now);o.frequency.exponentialRampToValueAtTime(frequency*(kind==='scan'?1.2:1.01),now+duration);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(kind==='scan'?.095:.065,now+.014);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+duration+.012)})
 }catch(e){}
}

 $('#sidebar').innerHTML=h;$$('#sidebar [data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)))}

 if(route==='home')$('#root').innerHTML=renderHome();else if(route==='glossary')$('#root').innerHTML=renderGlossary();else if(route==='phrases')$('#root').innerHTML=renderPhrases();else{let m=MODULES.find(m=>'lesson-'+m.id===route);$('#root').innerHTML=renderLesson(m);initLesson(m);decorateTerms($('#root'),m.vocab)}
 renderSidebar();$$('#root [data-nav]').forEach(x=>x.addEventListener('click',()=>navigate(x.dataset.nav)));
 if(route==='home')initHome();if(route==='glossary')initGlossary();if(route==='phrases')initPhrases();document.title=(route.startsWith('lesson-')?MODULES.find(m=>'lesson-'+m.id===route).name+' · ':'')+'AR / REAL TALK — Business English';
 }

function renderLesson(m){let i=MODULES.indexOf(m),next=MODULES[i+1],prev=MODULES[i-1];let html=`<div class="lesson-hero" data-theme="${m.theme}"><div><div class="hero-kicker">LESSON ${m.id} / ${esc(m.badge)}</div><h1>${esc(m.name)}.</h1><p>${esc(m.subtitle)}</p><div class="lesson-meta"><span class="pill">◷ ${esc(m.duration)}</span><span class="pill">B1 → B1+</span><span class="pill">${m.acts.length} activities</span></div></div><div class="lesson-art"><div class="art-big"></div><div class="orbit"></div><div class="tiny"></div></div></div>
 <section class="section-block"><div class="section-kicker">TODAY'S OBJECTIVES</div><h2>What you’ll be able to do</h2><p>Work towards these outcomes through realistic client situations.</p><div class="goal-grid">${m.outcomes.map(x=>`<div class="goal"><span class="check-icon">✓</span><span>${esc(x)}</span></div>`).join('')}</div><div class="case-card"><div class="label">${esc(m.scenario.kicker)}</div><h3>${esc(m.scenario.name)}</h3><p class="case-text">${esc(m.scenario.text)}</p><div class="outcome">↗ ${esc(m.scenario.deliverable)}</div>${caseArt(m.id)}</div></section>`;
 if(m.id==='01'){html+=`<section class="section-block"><div class="section-kicker">VISUAL LAB</div><h2>A small taste of the AR journey</h2><p>This is an animated concept illustration, not a real camera-based AR experience. Activate it and practise explaining what the user sees.</p><div class="demo-stage" id="demoStage"><div class="demo-tip">CONCEPT ANIMATION / VIEW 01</div><div class="demo-scan"></div><div class="demo-target"></div><div class="demo-item"></div></div><div class="demo-foot"><p>Describe it: “After scanning, a 3D object appears above the packaging.”</p><button class="button-soft small-btn" id="demoBtn">✦ Reveal the 3D object</button></div></section>`}
 html+=`<section class="section-block" id="vocabulary"><div class="section-kicker">THE WORDS YOU NEED</div><div class="section-title-row" style="margin-top:0"><div><h2>Industry vocabulary</h2><p>20 essential terms with practical examples. Tap a card to reveal the Russian translation.</p></div><div class="vocab-actions"><button class="button-outline small-btn" id="allTranslations">Show translations</button></div></div><div class="vocab-grid">${m.vocab.map(([en,ru,eg],j)=>`<button class="vocab-card" data-vocab="${j}"><span class="vocab-en">${esc(en)}</span><span class="vocab-ru">${esc(ru)}</span><span class="example">${esc(eg)}</span><span class="translate-hint">↻</span></button>`).join('')}</div></section>`;
 html+=`<section class="section-block"><div class="section-kicker">LANGUAGE & FRAMEWORKS</div><h2>Learn it. Then use it.</h2><p>Focus on phrases that work in real international meetings — not just definitions.</p>${m.theory.map(t=>`<article class="theory-card"><div class="tag">${esc(t.tag)}</div><h3>${esc(t.title)}</h3><div class="theory-body">${rich(t.body)}</div>${t.examples.map(([en,ru])=>`<div class="example-row"><div class="ex-en">${rich(en)}</div><span class="ex-ru">${esc(ru)}</span></div>`).join('')}</article>`).join('')}</section>`;
 if(m.id==='03'){html+=`<div class="motion-lab"><div class="eyebrow">MOTION DESIGN / INTERACTIVE</div><h3 style="margin:7px 0 15px">Explore easing and talk about timing</h3><div class="motion-track" id="motionTrack"><div class="motion-object" id="motionObject"></div></div><div class="motion-buttons"><button data-ease="linear">Linear motion</button><button data-ease="ease-in-out">Smooth motion</button><button data-ease="cubic-bezier(.2,1.5,.3,1)">Spring / overshoot</button></div><p style="color:#8794a9;font-size:12px">Say: “I’d suggest adjusting the easing to make the movement feel more natural.”</p></div>`}
 html+=`<div class="practice-intro"><div class="badge-num">✳</div><div><h2>Interactive practice</h2><p>Get instant feedback, save your writing and practise out loud.</p></div></div>`;
 html+=m.acts.map((a,j)=>{let separators='';if(j===4)separators='<div class="section-block" style="margin:29px 0 15px"><div class="section-kicker">PART TWO</div><h2 style="margin:4px 0">Client communication</h2></div>';if(j===8)separators='<div class="section-block" style="margin:29px 0 15px"><div class="section-kicker">PART THREE</div><h2 style="margin:4px 0">Real workplace challenges</h2></div>';return separators+renderExercise(m,a,j)}).join('');

function renderExercise(m,a,i){let id='ex-'+m.id+'-'+i,done=complete.has(m.id+':'+i);let out=`<article class="exercise ${done?'done':''}" id="${id}"><div class="ex-header"><span class="ex-index">${m.id}.${String(i+1).padStart(2,'0')}</span><div class="ex-headcopy"><div class="ex-type">${typeNames[a.type]}</div><h3>${esc(a.title)}</h3></div><span class="ex-status">✓ Done</span></div>`;
 if(a.prompt)out+=`<p class="activity-desc">${esc(a.prompt)}</p>`;
 if(a.quote)out+=`<div class="client-quote">${esc(a.quote)}</div>`;
 if(a.type==='mcq')out+=`<div class="option-list" id="opts-${id}">${a.options.map((o,j)=>`<button class="option" data-choice="${j}"><span class="choice-letter">${'ABC'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="feedback" id="fb-${id}" role="status"></div>`;
 if(a.type==='fill'){let n=-1,pass=esc(a.passage).replace(/___/g,()=>`<input class="answer-input" data-gap="${++n}" placeholder="type here" aria-label="Blank ${n+1}" autocomplete="off"/>`);out+=`<div class="gap-text">${pass}</div><div class="answer-hint">Optional help: ${esc(a.hint||'')}</div><div class="ex-controls"><button class="button-primary small-btn" data-action="check-fill">Check answers</button><button class="button-outline small-btn" data-action="reveal">Show solution</button></div><div class="feedback" id="fb-${id}" role="status"></div>`}
 if(a.type==='match'){let right=a.pairs.map((p,j)=>({text:p[1],j}));right=right.length>2?[...right.slice(2),...right.slice(0,2)].reverse():right.reverse();out+=`<p class="activity-desc">Click an English term, then its matching definition.</p><div class="match-grid"><div class="match-col">${a.pairs.map((p,j)=>`<button class="match-opt" data-left="${j}">${esc(p[0])}</button>`).join('')}</div><div class="match-col">${right.map(p=>`<button class="match-opt" data-right="${p.j}">${esc(p.text)}</button>`).join('')}</div></div><div class="feedback" id="fb-${id}" role="status"></div>`}
 if(a.type==='sort'){out+=`<p class="activity-desc">Click each step in the correct order. Your choices will appear below.</p><div class="sort-options" id="sort-options-${id}"></div><div class="picked-list" id="sort-picked-${id}"><span class="picked-placeholder">Your sequence will appear here…</span></div><div class="ex-controls"><button class="button-primary small-btn" data-action="check-sort">Check sequence</button><button class="button-outline small-btn" data-action="reset-sort">Start again</button></div><div class="feedback" id="fb-${id}" role="status"></div>`}
 if(a.type==='write'){let key=m.id+':'+i;out+=`<textarea class="writing-area" data-write="${key}" placeholder="Write your answer here…">${esc(noteGet(key))}</textarea><div class="word-count" id="wc-${id}">0 words</div><div class="criteria"><strong>SELF-CHECK / INCLUDE:</strong>${a.criteria.map(c=>`<label><input type="checkbox"> ${esc(c)}</label>`).join('')}</div><div class="ex-controls"><button class="button-primary small-btn" data-action="finish-write">I practised this</button><button class="button-outline small-btn" data-action="model-answer">Show model answer</button><button class="button-outline small-btn" data-action="copy-write">Copy my answer</button></div><div class="sample-box" id="model-${id}">${esc(a.sample)}</div><div class="feedback" id="fb-${id}" role="status"></div>`}
 if(a.type==='dialogue'){out+=`<p class="activity-desc">${esc(a.intro)}</p><div class="conversation"><div class="dialogue-progress" id="dp-${id}"></div><div class="chat-speaker">CLIENT SAYS</div><div class="chat-bubble" id="chat-${id}"></div><div class="option-list" id="opts-${id}"></div><div class="feedback" id="fb-${id}" role="status"></div></div>`}
 if(a.type==='roleplay'){out+=`<div class="roleplay-layout"><div class="roleplay-box"><h4>YOUR BRIEF</h4><p>${esc(a.brief)}</p><h4>YOUR MISSION</h4><p>${esc(a.mission)}</p><div class="roleplay-timer" id="timer-${id}">${Math.floor(a.seconds/60)}:${String(a.seconds%60).padStart(2,'0')}</div><div class="ex-controls"><button class="button-primary small-btn" data-action="start-timer">▶ Start timer</button><button class="button-outline small-btn" data-action="reset-timer">Reset</button></div></div><div class="roleplay-box accent"><div class="chat-speaker">YOUR CLIENT</div><div class="roleplay-question" id="roleq-${id}">${esc(a.client[0])}</div><button class="button-outline small-btn" data-action="next-roleq">Next client question →</button><p style="margin-top:18px">Speak out loud. Aim for clear, practical and natural English — not perfect memorised sentences.</p></div></div><div class="ex-controls"><button class="button-soft small-btn" data-action="finish-roleplay">✓ Mark speaking practice complete</button></div><div class="feedback" id="fb-${id}" role="status"></div>`}
 if(a.type==='metric'){let f=a.figures;out+=`<p class="activity-desc">${esc(a.explanation)}</p><div class="funnel-row">${f.map(([name,num])=>`<div class="funnel-node"><strong>${num.toLocaleString('en-US')}</strong><span>${esc(name)}</span></div>`).join('')}</div><div class="metric-fields"><div class="metric-field"><label>Start rate: AR starts / QR visits (%)</label><input type="number" step="0.1" class="answer-input" data-metric="0"/> %</div><div class="metric-field"><label>Completion rate: completed / AR starts (%)</label><input type="number" step="0.1" class="answer-input" data-metric="1"/> %</div><div class="metric-field"><label>CTA clicks / completed interactions (%)</label><input type="number" step="0.1" class="answer-input" data-metric="2"/> %</div></div><div class="ex-controls"><button class="button-primary small-btn" data-action="check-metric">Check the rates</button></div><div class="feedback" id="fb-${id}" role="status"></div>`}
 return out+'</article>'}
function feedback(el,text,good){el.innerHTML=esc(text);el.className='feedback show '+(good?'good':'bad')}
function initLesson(m){
 const togg=$('#allTranslations');if(togg){togg.addEventListener('click',()=>{const on=$('#root').classList.toggle('show-translations');togg.textContent=on?'Hide translations':'Show translations';fx('tap')})}
 $$('.vocab-card').forEach(el=>el.addEventListener('click',()=>{el.classList.toggle('revealed');fx('tap')}));
 const demo=$('#demoBtn');if(demo)demo.addEventListener('click',()=>{let stage=$('#demoStage');stage.classList.remove('live');void stage.offsetWidth;stage.classList.add('live');fx('scan');demo.textContent='↻ Replay reveal'});
 initMotion();const note=$('#lessonNote');if(note)note.addEventListener('input',()=>noteSet('lesson:'+m.id,note.value));const copyN=$('#copyLessonNotes');if(copyN)copyN.addEventListener('click',()=>copyText(note.value));
 m.acts.forEach((a,i)=>initExercise(m,a,i))}
function initExercise(m,a,i){const id='ex-'+m.id+'-'+i,root=$('#'+id),fb=$('#fb-'+id),done=()=>markDone(m.id,i);

function decorateTerms(root,vocab){let terms=vocab.map(v=>[v[0],v[1]]).filter(v=>v[0].length>3).sort((a,b)=>b[0].length-a[0].length);let rootNodes=root.querySelectorAll('.theory-body,.ex-en,.activity-desc,.case-text');rootNodes.forEach(cont=>{let walker=document.createTreeWalker(cont,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{let text=node.textContent;if(text.trim().length<5)return;let lower=text.toLowerCase(),matches=[],occupied=[];for(let [en,ru] of terms){let pos=0,needle=en.toLowerCase();while((pos=lower.indexOf(needle,pos))!==-1){let end=pos+needle.length;if(!occupied.some(([l,r])=>pos<r&&end>l)&&matches.length<12){matches.push({start:pos,end,ru});occupied.push([pos,end])}pos=end}}if(!matches.length)return;matches.sort((a,b)=>a.start-b.start);let frag=document.createDocumentFragment(),cursor=0;matches.forEach(x=>{if(x.start>cursor)frag.append(document.createTextNode(text.slice(cursor,x.start)));let span=document.createElement('span');span.className='term';span.textContent=text.slice(x.start,x.end);span.dataset.ru=x.ru;span.tabIndex=0;span.setAttribute('role','button');span.setAttribute('aria-label',span.textContent+': '+x.ru);span.addEventListener('click',()=>{span.classList.toggle('open');fx('tap')});frag.append(span);cursor=x.end});if(cursor<text.length)frag.append(document.createTextNode(text.slice(cursor)));node.replaceWith(frag)})})}

/* ===== snapshot ===== */
async function snapshot(){
  const md=navigator.mediaDevices;
  if(!md||!md.getDisplayMedia){note('Snapshots work in Chrome, Edge or Firefox on a computer. You can also press Win+Shift+S.',4200);return}
  note('Choose this tab in the window that opens.',3000);let stream;
  try{stream=await md.getDisplayMedia({video:{displaySurface:'browser'},audio:false,preferCurrentTab:true,selfBrowserSurface:'include',surfaceSwitching:'exclude'})}catch(e){note('Snapshot cancelled.',1800);return}
  const track=stream.getVideoTracks()[0];document.documentElement.classList.add('ink-snapping');noteEl.classList.remove('on');
  try{await new Promise(r=>setTimeout(r,450));let bmp=null;
    if('ImageCapture'in window){try{bmp=await new ImageCapture(track).grabFrame()}catch(e){bmp=null}}
    if(!bmp){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=stream;await v.play();await new Promise(r=>setTimeout(r,150));bmp=v}
    const w=bmp.videoWidth||bmp.width,h=bmp.videoHeight||bmp.height,cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);
    track.stop();stream.getTracks().forEach(t=>t.stop());document.documentElement.classList.remove('ink-snapping');
    cv.toBlob(b=>{if(b)showShot(b);else note('Could not make the snapshot.')},'image/png');
  }catch(e){try{stream.getTracks().forEach(t=>t.stop())}catch(_){}document.documentElement.classList.remove('ink-snapping');note('Could not make the snapshot.')}
}
function showShot(blob){
  const url=URL.createObjectURL(blob),d=new Date(),name=`lesson-snapshot-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.png`;
  const o=el('div','ink-shot');o.dataset.ink='';o.innerHTML=`<div class="ink-shot-card"><img alt="Snapshot of the lesson with drawings"><div class="ink-shot-row"><b>Snapshot ready</b><button type="button" data-a="copy">${ico(IC.copy)}Copy</button><button type="button" class="pri" data-a="save">${ico(IC.download)}Download</button><button type="button" data-a="close">${ico(IC.x)}Close</button></div></div>`;
  o.querySelector('img').src=url;document.body.appendChild(o);
  const close=()=>{o.remove();URL.revokeObjectURL(url)};
  o.addEventListener('click',async e=>{if(e.target===o){close();return}const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(a==='close')close();
    else if(a==='save'){const l=document.createElement('a');l.href=url;l.download=name;document.body.appendChild(l);l.click();l.remove();note('Saved to your downloads.',2000)}

}
